<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D5D9DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181B" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<title>Training</title>
<style>
:root{color-scheme:light;--bg:#D5D9DC;--card:#FCFCFA;--ink:#17191B;--muted:#596067;--rule:#B4BAC0;--field:#F0F1EF;--accent:#B3261E;--focus:#1F5FBF}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#15181B;--card:#23272B;--ink:#ECEDEE;--muted:#A5ACB3;--rule:#41474D;--field:#2D3237;--accent:#FF8F80;--focus:#8AB4FF}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.card{width:100%;max-width:360px;background:var(--card);border-radius:12px;padding:24px 20px}
h1{margin:0 0 4px;font-size:28px;font-weight:700}
.sub{margin:0 0 16px;color:var(--muted);font-size:15px}
input{width:100%;min-height:52px;font-size:20px;text-align:center;letter-spacing:.2em;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:0 12px}
button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-size:18px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.msg{min-height:22px;margin:12px 0 0;font-size:15px;color:var(--muted);text-align:center}
.msg.err{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main class="card">
<h1>Training</h1>
<p class="sub">PIN eingeben</p>
<form id="f" autocomplete="off">
<input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="PIN" autofocus>
<button type="submit" id="go">Öffnen</button>
</form>
<p class="msg" id="msg" role="status"></p>
</main>

var $=function(s){return document.querySelector(s)};
var inp=$("#pin"),msg=$("#msg"),btn=$("#go");
if(P.num){inp.setAttribute("inputmode","numeric");inp.setAttribute("pattern","[0-9]*")}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function say(t,err){msg.textContent=t;msg.className="msg"+(err?" err":"")}
async function unlock(pin){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin.normalize("NFC")),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
var tries=0,busy=false,lockTimer=null;
function cooldown(sec){
  btn.disabled=true;inp.disabled=true;
  (function tick(){
    if(sec<=0){btn.disabled=false;inp.disabled=false;busy=false;say("");inp.focus();return}
    say("Falsche PIN. Nächster Versuch in "+sec+" s.",true);sec--;lockTimer=setTimeout(tick,1000);
  })();
}
$("#f").addEventListener("submit",async function(e){
  e.preventDefault();
  if(busy||!inp.value)return;
  if(!window.crypto||!crypto.subtle){say("Dieser Browser kann nicht entschlüsseln. Öffne die Seite über https.",true);return}
  busy=true;btn.disabled=true;say("Entschlüssele …");
  var html;
  try{html=await unlock(inp.value)}
  catch(err){
    inp.value="";tries++;
    if(err&&err.name==="OperationError"){
      if(tries>=3){cooldown(Math.min(30,(tries-2)*3));return}
      say("Falsche PIN.",true);
    }else{say("Entschlüsseln hat nicht geklappt.",true)}
    busy=false;btn.disabled=false;inp.focus();return;
  }
  document.open();document.write(html);document.close();
});
})();
</script>
